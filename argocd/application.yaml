apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus-ai-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-repo/nexus-ai-workspace.git
    targetRevision: main
    path: helm/nexus-ai
    helm:
      valueFiles:
      - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true