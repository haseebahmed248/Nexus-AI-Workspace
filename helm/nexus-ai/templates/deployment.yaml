apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
    spec:
      containers:
      - name: frontend
        image: {{ .Values.frontend.image }}
        ports:
        - containerPort: {{ .Values.frontend.port }}
        resources: {{ toYaml .Values.frontend.resources | nindent 12 }}
        env:
        - name: NEXTAUTH_SECRET
          value: {{ .Values.frontend.env.NEXTAUTH_SECRET }}
        - name: NEXTAUTH_URL
          value: {{ .Values.frontend.env.NEXTAUTH_URL }}
        - name: NEXT_PUBLIC_API_URL
          value: {{ .Values.frontend.env.NEXT_PUBLIC_API_URL }}
      - name: backend
        image: {{ .Values.backend.image }}
        ports:
        - containerPort: {{ .Values.backend.port }}
        resources: {{ toYaml .Values.backend.resources | nindent 12 }}
        env:
        - name: FRONTEND_URL
          value: {{ .Values.backend.env.FRONTEND_URL }}
        - name: DB_HOST
          value: {{ .Values.backend.env.DB_HOST }}
        - name: DB_PORT
          value: {{ .Values.backend.env.DB_PORT }}
        - name: DATABASE_URL
          value: {{ .Values.backend.env.DATABASE_URL }}
        - name: EMAIL_USER
          value: {{ .Values.backend.env.EMAIL_USER }}
        - name: APP_PASSWORD
          value: {{ .Values.backend.env.APP_PASSWORD }}
        - name: REDIS_URL
          value: {{ .Values.backend.env.REDIS_URL }}
        - name: NEXTAUTH_SECRET
          value: {{ .Values.backend.env.NEXTAUTH_SECRET }}
        - name: JWT_SECRET
          value: {{ .Values.backend.env.JWT_SECRET }}
        - name: PORT
          value: {{ .Values.backend.env.PORT }}
        readinessProbe:
          tcpSocket:
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
      - name: db
        image: {{ .Values.db.image }}
        ports:
        - containerPort: {{ .Values.db.port }}
        resources: {{ toYaml .Values.db.resources | nindent 12 }}
        env:
        - name: POSTGRES_USER
          value: {{ .Values.db.env.POSTGRES_USER }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.db.env.POSTGRES_PASSWORD }}
      - name: redis
        image: {{ .Values.redis.image }}
        ports:
        - containerPort: {{ .Values.redis.port }}
        resources: {{ toYaml .Values.redis.resources | nindent 12 }}